<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Taplink</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: var(--clr-bg); }
    .reset-container { width: min(420px, calc(100% - 32px)); padding: 32px; border: 1px solid var(--clr-border); border-radius: 16px; background: var(--clr-surface); }
    .reset-container h1 { margin: 0 0 8px; }
    .reset-container p { margin: 0 0 24px; color: var(--clr-text-muted); }
    #resetStatus { display: none; margin-bottom: 16px; }
  </style>
</head>
<body>
  <main class="reset-container">
    <h1>Set a new password</h1>
    <p>Enter a new password for your Taplink admin account.</p>
    <div id="resetStatus" class="toast error"></div>
    <form id="resetPasswordForm">
      <div class="input-group">
        <label class="input-label" for="newPassword">New password</label>
        <input type="password" id="newPassword" class="input-field" minlength="6" required autocomplete="new-password">
      </div>
      <div class="input-group">
        <label class="input-label" for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" class="input-field" minlength="6" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="resetPasswordBtn" style="width:100%">Update password</button>
    </form>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.2/dist/umd/supabase.js" integrity="sha384-yifgV8iFWyp5cgu+V1G1rtlEHpEErPlL5fTrkUELIsWq0CIVDON2WP/NlXVJT3vO" crossorigin="anonymous"></script>
  <script type="module" src="js/main.js?v=5"></script>
  <script type="module" src="js/reset-password.js?v=5"></script>
</body>
</html>
